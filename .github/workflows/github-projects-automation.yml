  # ============================================================================
  # LABEL ORGANIZATION - AUTO-CATEGORIZE BY TYPE
  # ============================================================================
  auto-label-by-type:
    name: Auto-label by type
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Determine type and add label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue?.title || context.payload.pull_request?.title || '';
            const body = context.payload.issue?.body || context.payload.pull_request?.body || '';
            const isPR = context.payload.pull_request !== undefined;

            let labels = [];

            // Detect type from title/body
            if (title.includes('[SPEC]') || title.includes('spec:')) {
              labels.push('type:spec');
            } else if (title.match(/^feat/i) || body.match(/^feat/i)) {
              labels.push('type:feature');
            } else if (title.match(/^fix/i) || body.match(/^fix/i)) {
              labels.push('type:bug');
            } else if (title.match(/^docs/i) || body.match(/^docs/i)) {
              labels.push('type:docs');
            } else if (title.match(/^chore/i) || body.match(/^chore/i)) {
              labels.push('type:chore');
            } else if (title.match(/^refactor/i) || body.match(/^refactor/i)) {
              labels.push('type:refactor');
            } else if (title.match(/^test/i) || body.match(/^test/i)) {
              labels.push('type:test');
            }

            // Add priority if mentioned
            if (title.match(/P0|critical|blocker/i) || body.match(/P0|critical|blocker/i)) {
              labels.push('priority:critical');
            } else if (title.match(/P1|high/i) || body.match(/P1|high/i)) {
              labels.push('priority:high');
            } else if (title.match(/P2|medium/i) || body.match(/P2|medium/i)) {
              labels.push('priority:medium');
            } else {
              labels.push('priority:low');
            }

            // Add scope indicator
            if (title.includes('[OUT-OF-SCOPE]') || body.includes('[OUT-OF-SCOPE]')) {
              labels.push('out-of-scope');
            } else if (body.match(/out.?of.?scope/i)) {
              labels.push('out-of-scope');
            }

            if (labels.length > 0) {
              const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: labels
              });

              console.log(`Added labels: ${labels.join(', ')}`);
            }

  # ============================================================================
  # MILESTONE TRACKING - ASSIGN TO CURRENT SPRINT
  # ============================================================================
  auto-assign-milestone:
    name: Auto-assign to current sprint
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Get current milestone
        id: milestone
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch all milestones
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'due_date',
              direction: 'asc'
            });

            if (milestones.data.length > 0) {
              const current = milestones.data[0];
              core.setOutput('milestone_number', current.number);
              core.setOutput('milestone_title', current.title);
              console.log(`Current milestone: ${current.title}`);
            } else {
              console.log('No open milestone found');
            }

      - name: Assign to milestone
        if: steps.milestone.outputs.milestone_number
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
            const milestone = parseInt('${{ steps.milestone.outputs.milestone_number }}');

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              milestone: milestone
            });

            console.log(`Assigned to milestone: ${{ steps.milestone.outputs.milestone_title }}`);

  # ============================================================================
  # REVERSE SYNC - Update GitHub labels when item moved on project board
  # ============================================================================
  sync-board-to-github:
    name: Sync project status to GitHub labels
    runs-on: ubuntu-latest
    if: github.event_name == 'projects_v2_item' && github.event.action == 'edited'
    steps:
      - name: Update issue/PR labels based on project status
        uses: actions/github-script@v7
        with:
          script: |
            const { projects_v2_item } = context.payload;
            const org = 'Maximus-Technologies-Uganda';
            const projectNumber = 6;

            if (!projects_v2_item || !projects_v2_item.content_node_id) {
              console.log('No item content found');
              return;
            }

            // Query to get the issue/PR and current status
            const query = `
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    number
                    repository {
                      owner {
                        login
                      }
                      name
                    }
                  }
                  ... on PullRequest {
                    number
                    repository {
                      owner {
                        login
                      }
                      name
                    }
                  }
                }
              }
            `;

            const nodeResult = await github.graphql(query, { id: projects_v2_item.content_node_id });
            const node = nodeResult.node;

            if (!node || !node.number) {
              console.log('Could not find issue/PR');
              return;
            }

            // Query project to get the status field value
            const projectQuery = `
              query {
                organization(login: "${org}") {
                  projectV2(number: ${projectNumber}) {
                    items(first: 1, after: null) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                          ... on PullRequest {
                            number
                          }
                        }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectResult = await github.graphql(projectQuery);
            const items = projectResult.organization.projectV2.items.nodes;
            const item = items.find(i => i.content?.number === node.number);

            if (!item || !item.fieldValueByName) {
              console.log(`Item #${node.number} not found in project or has no status`);
              return;
            }

            const status = item.fieldValueByName.name;
            console.log(`Issue #${node.number} status changed to: ${status}`);

            // Map status to labels
            const statusToLabel = {
              'Todo': 'status/todo',
              'In Progress': 'status/in-progress',
              'In review': 'status/in-review',
              'Done': 'status/done'
            };

            const labelToAdd = statusToLabel[status];
            if (!labelToAdd) {
              console.log(`Unknown status: ${status}`);
              return;
            }

            // Remove old status labels and add new one
            const allStatusLabels = Object.values(statusToLabel);

            await github.rest.issues.removeLabel({
              owner: node.repository.owner.login,
              repo: node.repository.name,
              issue_number: node.number,
              name: allStatusLabels[0]
            }).catch(() => null);

            await github.rest.issues.removeLabel({
              owner: node.repository.owner.login,
              repo: node.repository.name,
              issue_number: node.number,
              name: allStatusLabels[1]
            }).catch(() => null);

            await github.rest.issues.removeLabel({
              owner: node.repository.owner.login,
              repo: node.repository.name,
              issue_number: node.number,
              name: allStatusLabels[2]
            }).catch(() => null);

            await github.rest.issues.removeLabel({
              owner: node.repository.owner.login,
              repo: node.repository.name,
              issue_number: node.number,
              name: allStatusLabels[3]
            }).catch(() => null);

            // Add the new status label
            await github.rest.issues.addLabels({
              owner: node.repository.owner.login,
              repo: node.repository.name,
              issue_number: node.number,
              labels: [labelToAdd]
            });

            console.log(`✅ Updated #${node.number} with label: ${labelToAdd}`);

  # ============================================================================
  # FIX EXISTING ISSUES - Move T001-T047 from "In Progress" to "Todo"
  # ============================================================================
  fix-existing-issues:
    name: Fix existing task issues status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fix T001-T047 issues to Todo status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const org = 'Maximus-Technologies-Uganda';
            const projectNumber = 6;

            // Query project and get all items
            const query = `
              query {
                organization(login: "${org}") {
                  projectV2(number: ${projectNumber}) {
                    id
                    fields(first: 10) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            console.log('Querying project...');
            const result = await github.graphql(query);
            const project = result.organization.projectV2;

            // Find Status field and Todo option
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('Status field not found');
              return;
            }

            const todoOption = statusField.options.find(o => o.name === 'Todo');
            if (!todoOption) {
              console.log('Todo option not found');
              return;
            }

            console.log(`Found Status field and Todo option`);
            console.log(`Updating issues T001-T047...\n`);

            let updated = 0;
            let skipped = 0;

            // Find and update all T00X issues
            for (const item of project.items.nodes) {
              if (!item.content) continue;

              const title = item.content.title;
              const match = title.match(/^(T\d+):/);

              if (match) {
                const taskId = match[1];
                const taskNum = parseInt(taskId.substring(1));

                if (taskNum >= 1 && taskNum <= 47) {
                  process.stdout.write(`Updating ${taskId}... `);

                  const updateQuery = `
                    mutation {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: "${project.id}"
                        itemId: "${item.id}"
                        fieldId: "${statusField.id}"
                        value: {singleSelectOptionId: "${todoOption.id}"}
                      }) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  `;

                  try {
                    await github.graphql(updateQuery);
                    console.log('✅');
                    updated++;
                  } catch (error) {
                    console.log('❌');
                    skipped++;
                  }
                }
              }
            }

            console.log(`\n✅ Updated ${updated} issues to "Todo"`);
            if (skipped > 0) {
              console.log(`⚠️  Skipped ${skipped} issues`);
            }
            console.log('Done!');
