name: GitHub Projects Automation
on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      fix_existing_issues:
        description: 'Fix existing T001-T047 issues to Todo status'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ============================================================================
  # CONFIGURATION: Update PROJECT_ID below with your Training project's numeric ID
  # To find your project ID: Open your Training project on GitHub, the URL will be
  # https://github.com/orgs/Maximus-Technologies-Uganda/projects/XXX where XXX is the ID
  # ============================================================================

  # ============================================================================
  # AUTO-ADD ITEMS TO GITHUB PROJECTS
  # ============================================================================
  auto-add-to-projects:
    name: Auto-add to Training project
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Add all PRs and issues to Training project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/Maximus-Technologies-Uganda/projects/6
          github-token: ${{ secrets.PROJECT_TOKEN }}

  # ============================================================================
  # STATUS AUTOMATION - PR EVENTS (GitHub Script with GraphQL)
  # ============================================================================
  update-status-pr-opened:
    name: Update status (PR Opened)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set PR status to "In Progress"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const org = 'Maximus-Technologies-Uganda';
            const projectNumber = 6;

            // Query project and find item
            const query = `
              query {
                organization(login: "${org}") {
                  projectV2(number: ${projectNumber}) {
                    id
                    fields(first: 10) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first: 100, query: "is:open") {
                      nodes {
                        id
                        content {
                          ... on PullRequest {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const project = result.organization.projectV2;

            // Find status field and In Progress option
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('Status field not found in project');
              return;
            }

            const inProgressOption = statusField.options.find(o => o.name === 'In Progress');
            if (!inProgressOption) {
              console.log('In Progress option not found');
              return;
            }

            // Find the PR item
            const prItem = project.items.nodes.find(item =>
              item.content?.number === prNumber
            );

            if (!prItem) {
              console.log(`PR #${prNumber} not found in project`);
              return;
            }

            // Update status to In Progress
            const updateQuery = `
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: "${project.id}"
                  itemId: "${prItem.id}"
                  fieldId: "${statusField.id}"
                  value: {singleSelectOptionId: "${inProgressOption.id}"}
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            const updateResult = await github.graphql(updateQuery);
            console.log(`Updated PR #${prNumber} status to "In Progress"`);

