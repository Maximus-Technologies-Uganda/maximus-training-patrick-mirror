name: Week 10 Release Tag

on:
  push:
    branches:
      - main
    # Only run release workflow when specific files change
    # This prevents unintended tags on every merge
    paths:
      - 'RELEASE-NOTES.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/release/tag-week10.ts'

jobs:
  tag-week10:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create tags and push to repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Week 10 tag script
        run: pnpm exec tsx scripts/release/tag-week10.ts
