name: Quality Gate

on:
  push:
    paths:
      - 'frontend/**'
      - 'frontend-next/**'
      - 'api/**'
      - 'specs/007-spec/week-7.5-finishers/contracts/**'
      - 'specs/008-identity-platform/contracts/**'
      - 'docs/ReviewPacket/**'
      - '.github/workflows/quality-gate.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'frontend-next/**'
      - 'api/**'
      - 'specs/007-spec/week-7.5-finishers/contracts/**'
      - 'specs/008-identity-platform/contracts/**'
      - 'docs/ReviewPacket/**'
      - '.github/workflows/quality-gate.yml'

jobs:
  readme-link-check:
    name: README link check
    runs-on: ubuntu-latest
    continue-on-error: true
    # NOTE: Shift-left strategy - this check runs locally in Tier 3 Phase 3
    # GitHub check is non-blocking (informational only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.x --activate
          pnpm install --frozen-lockfile --reporter=silent
      - name: Link check README
        run: node scripts/link-check.js README.md
      - name: Enforce PR template
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-pr-template.js
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  readme-placeholder-guard:
    name: README placeholder guard
    runs-on: ubuntu-latest
    continue-on-error: true
    # NOTE: Shift-left strategy - this check runs locally in Tier 3 Phase 3
    # GitHub check is non-blocking (informational only)
    steps:
      - uses: actions/checkout@v4
      - name: Fail if README contains placeholder URLs
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '(YOUR_CLOUD_RUN_URL|example\.com/placeholder|<LIVE_URL>)' -n README.md; then
            echo "README contains placeholder URL patterns. Replace with real URLs." >&2
            exit 1
          fi
  lint-workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    continue-on-error: true
    # NOTE: Shift-left strategy - this check runs locally in Tier 3 Phase 3
    # GitHub check is non-blocking (informational only)
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          actionlint_flags: '.github/workflows/*.yml'
          reporter: github-check
          fail_level: error
  install-root-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-pnpm

      - name: Resolve pnpm store path
        id: pnpm-store-root
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm -v | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (with version fallback)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-root.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-root.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-root.outputs.version }}-
            ${{ runner.os }}-pnpm-store-
      - name: Install root dependencies (pnpm)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --frozen-lockfile=false --silent

  frontend-next-a11y:
    needs: install-root-deps
    runs-on: ubuntu-latest
    outputs:
      has_playwright_tests: ${{ steps.detect_frontend_next_playwright.outputs.has_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Playwright specs
        id: detect_frontend_next_playwright
        shell: bash
        run: |
          set -euo pipefail
          target_dir="frontend-next/tests/playwright"
          has_tests="false"
          if [ -d "$target_dir" ]; then
            if find "$target_dir" -type f -name '*.spec.ts' -print -quit | grep -q '.'; then
              has_tests="true"
            fi
          fi
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"
          if [ "$has_tests" != "true" ]; then
            echo "No Playwright specs found in $target_dir; skipping accessibility checks."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-pnpm
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}

      - name: Resolve pnpm store path
        id: pnpm-store-a11y
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        with:
          path: ${{ steps.pnpm-store-a11y.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (pnpm)
        shell: bash
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --frozen-lockfile=false
          cd frontend-next
          pnpm install --ignore-scripts --frozen-lockfile=false

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm dlx playwright install --with-deps

      - name: Run Playwright a11y/e2e tests (HTML report)
        working-directory: frontend-next
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' }}
        run: npm run test:e2e

      - name: Upload a11y HTML report artifact
        if: ${{ steps.detect_frontend_next_playwright.outputs.has_tests == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-frontend-next
          path: |
            a11y-frontend-next/**
          if-no-files-found: warn
          retention-days: 21

  frontend-next-coverage:
    needs: install-root-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-pnpm

      - name: Resolve pnpm store path
        id: pnpm-store-cov
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm -v | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (with version fallback)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-cov.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-cov.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-cov.outputs.version }}-
            ${{ runner.os }}-pnpm-store-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            frontend-next/.next/cache
            frontend-next/.turbo
          key: ${{ runner.os }}-nextjs-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ github.ref }}-
            ${{ runner.os }}-nextjs-

      - name: Cache ESLint results
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ github.ref }}-
            ${{ runner.os }}-eslint-

      - name: Install dependencies (pnpm)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --frozen-lockfile=false
          # Ensure frontend-next has its dependencies
          cd frontend-next
          pnpm install --ignore-scripts --frozen-lockfile=false

      - name: Run frontend-next tests with coverage
        working-directory: frontend-next
        run: npm run test:ci

      - name: Validate coverage directory
        id: validate_coverage_frontend_next
        working-directory: frontend-next
        run: |
          if [ -d coverage ] && [ -f coverage/coverage-summary.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            ls -la coverage/ || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Coverage directory or coverage-summary.json not found" >&2
            for item in coverage*; do [ -e "$item" ] && ls -la "$item"; done || true
          fi

      - name: Upload frontend-next coverage artifact
        if: always() && steps.validate_coverage_frontend_next.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-next
          path: |
            frontend-next/coverage/**
          retention-days: 21
          if-no-files-found: warn

      - name: Read coverage summary
        if: steps.validate_coverage_frontend_next.outputs.exists == 'true'
        id: coverage_frontend_next
        working-directory: frontend-next
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const summaryPath = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
          if (!fs.existsSync(summaryPath)) {
            console.error('ERROR: Coverage summary not found at coverage/coverage-summary.json. Ensure Vitest runs with coverage.');
            try {
              console.log('Listing coverage directory for diagnostics:');
              console.log(fs.readdirSync(path.join(process.cwd(), 'coverage')).join('\n'));
            } catch (e) {
              console.log('No coverage directory present.');
            }
            process.exit(1);
          }
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8')); }
          catch (e) {
            console.error('ERROR: Failed to parse coverage/coverage-summary.json:', e.message);
            process.exit(1);
          }
          function statementsPct(summary){
            if (!summary || !summary.total || !summary.total.statements) return 'no files collected';
            const t = summary.total.statements;
            if (typeof t.total === 'number' && t.total === 0) return 'no files collected';
            if (typeof t.pct === 'number') return String(t.pct) + '%';
            return 'no files collected';
          }
          const rows = [['Target','Statements %'], ['frontend-next', statementsPct(summary)]];
          const pad = (arr, widths) => arr.map((c,i)=>String(c).padEnd(widths[i])).join(' | ');
          const widths = rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));
          let table = `| ${pad(rows[0], widths)} |\n| ${widths.map(w=>'-'.repeat(w)).join(' | ')} |\n`;
          for (let i=1;i<rows.length;i++){ table += `| ${pad(rows[i], widths)} |\n`; }
          fs.writeFileSync('coverage-table.md', table);
          console.log(table);
          NODE

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report-frontend-next
          path: frontend-next/coverage-table.md

  frontend-coverage:
    needs: install-root-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-pnpm

      - name: Resolve pnpm store path
        id: pnpm-store-frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm -v | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (with version fallback)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-frontend.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-frontend.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-frontend.outputs.version }}-
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (pnpm)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --frozen-lockfile=false
          # Ensure frontend has its dependencies
          cd frontend
          pnpm install --ignore-scripts --frozen-lockfile=false

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/**
          if-no-files-found: warn
          retention-days: 21

      - name: Read coverage summary
        id: coverage_frontend
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const summaryPath = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
          if (!fs.existsSync(summaryPath)) {
            console.error('ERROR: Coverage summary not found at coverage/coverage-summary.json. Ensure Vitest runs with coverage.');
            try {
              console.log('Listing coverage directory for diagnostics:');
              console.log(fs.readdirSync(path.join(process.cwd(), 'coverage')).join('\n'));
            } catch (e) {
              console.log('No coverage directory present.');
            }
            process.exit(1);
          }
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8')); }
          catch (e) {
            console.error('ERROR: Failed to parse coverage/coverage-summary.json:', e.message);
            process.exit(1);
          }
          function statementsPct(summary){
            if (!summary || !summary.total || !summary.total.statements) return 'no files collected';
            const t = summary.total.statements;
            if (typeof t.total === 'number' && t.total === 0) return 'no files collected';
            if (typeof t.pct === 'number') return String(t.pct) + '%';
            return 'no files collected';
          }
          const rows = [['Target','Statements %'], ['frontend', statementsPct(summary)]];
          const pad = (arr, widths) => arr.map((c,i)=>String(c).padEnd(widths[i])).join(' | ');
          const widths = rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));
          let table = `| ${pad(rows[0], widths)} |\n| ${widths.map(w=>'-'.repeat(w)).join(' | ')} |\n`;
          for (let i=1;i<rows.length;i++){ table += `| ${pad(rows[i], widths)} |\n`; }
          fs.writeFileSync('coverage-table.md', table);
          console.log(table);
          NODE

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report-frontend
          path: frontend/coverage-table.md
  monorepo-workspace-tests:
    name: Test monorepo workspaces (matrix)
    needs: install-root-deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [quote, todo, expense, stopwatch]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-pnpm

      - name: Resolve pnpm store path
        id: pnpm-store-ws
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm -v | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-ws.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-ws.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v${{ steps.pnpm-store-ws.outputs.version }}-
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --ignore-scripts --frozen-lockfile=false

      - name: Run ${{ matrix.workspace }} tests
        working-directory: ${{ matrix.workspace }}
        run: npm run test:ci

      - name: Validate coverage directory
        id: validate_coverage_ws
        working-directory: ${{ matrix.workspace }}
        run: |
          if [ -d coverage ] && [ -f coverage/coverage-summary.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            ls -la coverage/ || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Coverage directory or coverage-summary.json not found for ${{ matrix.workspace }}" >&2
            for item in coverage*; do [ -e "$item" ] && ls -la "$item"; done || true
          fi

      - name: Upload ${{ matrix.workspace }} coverage
        if: always() && steps.validate_coverage_ws.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.workspace }}
          path: |
            ${{ matrix.workspace }}/coverage/**
          retention-days: 21
          if-no-files-found: warn

  api-coverage:
    needs: install-root-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache Jest
        uses: actions/cache@v4
        with:
          path: api/.jest-cache
          key: ${{ runner.os }}-jest-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ github.ref }}-
            ${{ runner.os }}-jest-

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm config set audit false --location=project
          npm config set fund false --location=project
          npm config set fetch-retries 5 --location=project
          npm config set fetch-retry-mintimeout 20000 --location=project
          npm config set fetch-retry-maxtimeout 600000 --location=project
          corepack enable
          corepack prepare pnpm@9.x --activate
          # Install root and workspace dependencies
          pnpm install --frozen-lockfile
          # Ensure API has its dependencies (already installed above)
          cd api

      - name: Debug available api scripts
        run: |
          node -e "const p=require('./api/package.json');console.log('scripts',p.scripts)" | cat
          ls -la api
          ls -la api/node_modules/.bin || true
          node -e "console.log(process.cwd())"

      - name: Run API tests with coverage (in-memory repo)
        working-directory: api
        env:
          POSTS_REPOSITORY: inmemory
        run: npm run test:ci

      - name: Validate coverage directory
        id: validate_coverage_api
        working-directory: api
        run: |
          if [ -d coverage ] && [ -f coverage/coverage-summary.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            ls -la coverage/ || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Coverage directory or coverage-summary.json not found" >&2
            for item in coverage*; do [ -e "$item" ] && ls -la "$item"; done || true
          fi

      - name: Upload API coverage artifact
        if: always() && steps.validate_coverage_api.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: |
            api/coverage/**
          retention-days: 21
          if-no-files-found: warn

      - name: Read coverage summary
        if: steps.validate_coverage_api.outputs.exists == 'true'
        id: api_coverage
        working-directory: api
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const summaryPath = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
          if (!fs.existsSync(summaryPath)) {
            console.error('ERROR: Coverage summary not found at coverage/coverage-summary.json. Ensure Jest runs with coverage.');
            try {
              console.log('Listing coverage directory for diagnostics:');
              console.log(fs.readdirSync(path.join(process.cwd(), 'coverage')).join('\n'));
            } catch (e) {
              console.log('No coverage directory present.');
            }
            process.exit(1);
          }
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8')); }
          catch (e) {
            console.error('ERROR: Failed to parse coverage/coverage-summary.json:', e.message);
            process.exit(1);
          }
          function statementsPct(summary){
            if (!summary || !summary.total || !summary.total.statements) return 'no files collected';
            const t = summary.total.statements;
            if (typeof t.total === 'number' && t.total === 0) return 'no files collected';
            if (typeof t.pct === 'number') return String(t.pct) + '%';
            return 'no files collected';
          }
          const rows = [['Target','Statements %'], ['API', statementsPct(summary)]];
          const pad = (arr, widths) => arr.map((c,i)=>String(c).padEnd(widths[i])).join(' | ');
          const widths = rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));
          let table = `| ${pad(rows[0], widths)} |\n| ${widths.map(w=>'-'.repeat(w)).join(' | ')} |\n`;
          for (let i=1;i<rows.length;i++){ table += `| ${pad(rows[i], widths)} |\n`; }
          fs.writeFileSync('api-coverage-table.md', table);
          console.log(table);
          NODE

      - name: Fail on zero coverage (api)
        if: always()
        run: |
          set -euo pipefail
          FILE="api/coverage/coverage-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "WARN: api coverage summary not found at $FILE; skipping zero-coverage check." >&2
            exit 0
          fi
          node - <<'NODE'
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.cwd(), 'api', 'coverage', 'coverage-summary.json');
            const j = JSON.parse(fs.readFileSync(file, 'utf8'));
            const s = j?.total?.statements?.pct;
            const l = j?.total?.lines?.pct;
            const ok = (v) => typeof v === 'number' && v > 0;
            if (!ok(s) || !ok(l)) {
              console.error(`ERROR: Coverage totals must be > 0%. statements=${s ?? 'N/A'} lines=${l ?? 'N/A'}`);
              process.exit(1);
            }
          NODE

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-coverage-report
          path: api/api-coverage-table.md

      - name: Fail on zero coverage (frontend)
        if: always()
        run: |
          set -euo pipefail
          FILE="frontend/coverage/coverage-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "WARN: frontend coverage summary not found at $FILE; skipping zero-coverage check." >&2
            exit 0
          fi
          node - <<'NODE'
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.cwd(), 'frontend', 'coverage', 'coverage-summary.json');
            const j = JSON.parse(fs.readFileSync(file, 'utf8'));
            const s = j?.total?.statements?.pct;
            const l = j?.total?.lines?.pct;
            const ok = (v) => typeof v === 'number' && v > 0;
            if (!ok(s) || !ok(l)) {
              console.error(`ERROR: Coverage totals must be > 0%. statements=${s ?? 'N/A'} lines=${l ?? 'N/A'}`);
              process.exit(1);
            }
          NODE

