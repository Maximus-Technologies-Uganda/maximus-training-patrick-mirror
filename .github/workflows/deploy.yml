name: Deploy (DEPRECATED - Use Build and Deploy workflow)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: >-
          Optional context for manually invoking this deprecated workflow. Build and
          deploy via build-and-deploy.yml instead.
        required: false

# DEPRECATED: This workflow has been replaced by 'build-and-deploy.yml'
# GitHub Actions now handles building and deploying directly instead of using Cloud Build.
# This workflow is disabled to prevent duplicate deployments.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deprecated:
    name: Deprecated deploy stub
    runs-on: ubuntu-latest
    steps:
      - name: Abort deprecated workflow
        run: |
          echo "This workflow has been replaced by .github/workflows/build-and-deploy.yml."
          echo "Trigger the new workflow instead of running this deprecated Cloud Build pipeline."
