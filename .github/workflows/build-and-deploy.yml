name: Build and Deploy to Cloud Run

on:
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: proj-app-dev
  REGION: africa-south1
  AR_REPOSITORY: cloud-run-images
  API_SERVICE_NAME: maximus-training-api
  FRONTEND_SERVICE_NAME: maximus-training-frontend
  WORKLOAD_IDENTITY_PROVIDER: projects/673209018655/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-deployer@proj-app-dev.iam.gserviceaccount.com
  DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
  DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: build-deploy-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Ensure Artifact Registry exists
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${{ env.AR_REPOSITORY }}" \
            --location="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            || gcloud artifacts repositories create "${{ env.AR_REPOSITORY }}" \
              --repository-format=docker \
              --location="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --description="Cloud Run images"

      # =====================
      # BUILD AND DEPLOY API
      # =====================

      - name: Build API Docker image
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.API_SERVICE_NAME }}:${{ env.DEPLOY_SHA }}"
          echo "API_IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          docker build \
            --progress=plain \
            -t "${IMAGE_URI}" \
            -f api/Dockerfile \
            api

      - name: Push API Docker image
        run: |
          set -euo pipefail
          if [ -z "${API_IMAGE_URI:-}" ]; then
            echo "API_IMAGE_URI is not set" >&2
            exit 1
          fi
          docker push "$API_IMAGE_URI"

      - name: Deploy API to Cloud Run
        run: |
          set -euo pipefail
          if [ -z "${API_IMAGE_URI:-}" ]; then
            echo "API_IMAGE_URI is not set" >&2
            exit 1
          fi
          gcloud run deploy "${{ env.API_SERVICE_NAME }}" \
            --image="$API_IMAGE_URI" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300s \
            --ingress=all \
            --no-allow-unauthenticated

      - name: Get API URL
        id: api-url
        run: |
          set -euo pipefail
          API_URL=$(gcloud run services describe "${{ env.API_SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')
          if [ -z "$API_URL" ]; then
            echo "Failed to resolve API URL" >&2
            exit 1
          fi
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved API URL: $API_URL"

      # =====================
      # BUILD AND DEPLOY FRONTEND
      # =====================

      - name: Build Frontend Docker image
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ env.DEPLOY_SHA }}"
          echo "FRONTEND_IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          docker build \
            --progress=plain \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.api-url.outputs.url }}" \
            -t "${IMAGE_URI}" \
            -f frontend-next/Dockerfile \
            .

      - name: Push Frontend Docker image
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_IMAGE_URI:-}" ]; then
            echo "FRONTEND_IMAGE_URI is not set" >&2
            exit 1
          fi
          docker push "$FRONTEND_IMAGE_URI"

      - name: Deploy Frontend to Cloud Run
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_IMAGE_URI:-}" ]; then
            echo "FRONTEND_IMAGE_URI is not set" >&2
            exit 1
          fi
          gcloud run deploy "${{ env.FRONTEND_SERVICE_NAME }}" \
            --image="$FRONTEND_IMAGE_URI" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --port=8080 \
            --set-env-vars="NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,API_BASE_URL=${{ steps.api-url.outputs.url }},ID_TOKEN_AUDIENCE=${{ steps.api-url.outputs.url }}" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --timeout=300s \
            --ingress=all \
            --allow-unauthenticated

      - name: Get Frontend URL
        id: frontend-url
        run: |
          set -euo pipefail
          FRONTEND_URL=$(gcloud run services describe "${{ env.FRONTEND_SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')
          if [ -z "$FRONTEND_URL" ]; then
            echo "Failed to resolve Frontend URL" >&2
            exit 1
          fi
          echo "url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Frontend URL: $FRONTEND_URL"

      # =====================
      # POST-DEPLOYMENT VERIFICATION
      # =====================

      - name: Grant Frontend invoker role on API
        continue-on-error: true
        run: |
          set -euo pipefail
          FRONTEND_SA=$(gcloud run services describe "${{ env.FRONTEND_SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(spec.template.spec.serviceAccountName)')
          if [ -n "$FRONTEND_SA" ]; then
            gcloud run services add-iam-policy-binding "${{ env.API_SERVICE_NAME }}" \
              --project="${{ env.PROJECT_ID }}" \
              --region="${{ env.REGION }}" \
              --member="serviceAccount:${FRONTEND_SA}" \
              --role="roles/run.invoker"
          fi

      - name: Verify Frontend deployment
        run: |
          set -euo pipefail
          FRONTEND_URL="${{ steps.frontend-url.outputs.url }}"
          echo "Verifying Frontend at: $FRONTEND_URL"

          for i in {1..20}; do
            CODE=$(curl -s -L --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "$FRONTEND_URL") || true
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              echo "✓ Frontend responding with HTTP $CODE"
              exit 0
            fi
            echo "Attempt $i/20: HTTP $CODE; retrying..."
            sleep 5
          done
          echo "✗ Frontend verification failed" >&2
          exit 1

      - name: Write deployment summary
        if: always()
        run: |
          set -euo pipefail
          FRONTEND_URL="${{ steps.frontend-url.outputs.url }}"
          API_URL="${{ steps.api-url.outputs.url }}"
          COMMIT_SHA="${{ env.DEPLOY_SHA }}"

          {
            echo "## ✅ Build & Deploy to Cloud Run"
            echo ""
            echo "### Deployment Information"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| **Commit SHA** | \`${COMMIT_SHA:0:7}\` ([full](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})) |"
            echo "| **Branch** | \`${{ env.DEPLOY_BRANCH }}\` |"
            echo "| **Workflow** | [Build & Deploy](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Deployed Services & URLs"
            echo "| Service | Region | URL |"
            echo "| --- | --- | --- |"
            echo "| Frontend | ${{ env.REGION }} | [\`${FRONTEND_URL}\`](${FRONTEND_URL}) |"
            echo "| API | ${{ env.REGION }} | [\`${API_URL}\`](${API_URL}) |"
            echo ""
            echo "### Build Information"
            echo "- **API Image**: \`${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.API_SERVICE_NAME }}:${{ env.DEPLOY_SHA }}\`"
            echo "- **Frontend Image**: \`${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ env.DEPLOY_SHA }}\`"
            echo ""
            echo "### Authentication Method"
            echo "✓ **Workload Identity Federation (WIF)** — No secrets/credentials in GitHub"
          } >> "$GITHUB_STEP_SUMMARY"
