substitutions:
  _SERVICE_NAME: maximus-training-frontend
  _REGION: africa-south1
  _AR_REPOSITORY: cloud-run-images
  _PROD_API_URL: https://maximus-training-api-wyb2jsgqyq-bq.a.run.app
  _SERVICE_ACCOUNT: ""
  _ALLOW_UNAUTH: "false"
  # Bash variables used in script blocks (defined by Cloud Build)
  PROJECT_ID: ""
  BUILD_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Debug Context
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euxo pipefail
        echo "Project: ${PROJECT_ID}"
        gcloud --version
        gcloud auth list
        gcloud config list

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Ensure Artifact Registry
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euxo pipefail
        gcloud artifacts repositories describe "${_AR_REPOSITORY}" --location="${_REGION}" \
          || gcloud artifacts repositories create "${_AR_REPOSITORY}" --repository-format=docker --location="${_REGION}" --description="Cloud Run images" \
          || echo "Repo ensure step failed (permissions?); continuing."
  - name: "gcr.io/cloud-builders/docker"
    id: Build Image
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - "--progress=plain"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}"
      - "-f"
      - "frontend-next/Dockerfile"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_PROD_API_URL}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push Image
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Deploy to Cloud Run
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euxo pipefail
        ENVVARS="NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,API_BASE_URL=${_PROD_API_URL},ID_TOKEN_AUDIENCE=${_PROD_API_URL}"
        DEPLOY_ARGS=(run deploy "${_SERVICE_NAME}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --set-env-vars="$ENVVARS" \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --timeout=300s \
          --ingress=all)
        if [ "${_ALLOW_UNAUTH}" = "true" ]; then
          DEPLOY_ARGS+=(--allow-unauthenticated)
        fi
        if [ -n "${_SERVICE_ACCOUNT}" ]; then
          DEPLOY_ARGS+=(--service-account="${_SERVICE_ACCOUNT}")
        fi
        gcloud --verbosity=debug "${DEPLOY_ARGS[@]}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Grant Frontend Invoker Role on API
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euxo pipefail
        # Get the frontend service account email
        FRONTEND_SA=$(gcloud run services describe "${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format='value(spec.template.spec.serviceAccountName)')

        if [ -z "${FRONTEND_SA}" ]; then
          echo "Warning: Could not determine frontend service account; skipping IAM binding."
          exit 0
        fi

        # Derive full service account email if it's just the name
        if [[ "${FRONTEND_SA}" != *"@"* ]]; then
          FRONTEND_SA="${FRONTEND_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
        fi

        echo "Granting ${FRONTEND_SA} invoker role on API service..."
        # Extract API service name from API_BASE_URL (e.g., https://service-hash.region.run.app -> service-hash)
        API_SERVICE_NAME=$(echo "${_PROD_API_URL}" | sed -E 's|https://([a-z0-9-]+)\..+|\1|')

        if [ -z "${API_SERVICE_NAME}" ]; then
          echo "Warning: Could not parse API service name from ${_PROD_API_URL}; skipping IAM binding."
          exit 0
        fi

        gcloud run services add-iam-policy-binding "${API_SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --member="serviceAccount:${FRONTEND_SA}" \
          --role="roles/run.invoker" \
          --condition=None \
          --quiet || echo "IAM binding already exists or failed; continuing."

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Verify Frontend
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euxo pipefail
        if [ "${_ALLOW_UNAUTH}" != "true" ]; then
          echo "Service is private; skipping anonymous HTTP verification."
          exit 0
        fi
        SERVICE_URL=$(gcloud run services describe "${_SERVICE_NAME}" --project "${PROJECT_ID}" --region "${_REGION}" --format='value(status.url)')
        echo "Service URL: $$SERVICE_URL"
        sleep 10
        for i in {1..20}; do
          CODE=$(curl -s -L --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "$$SERVICE_URL") || true
          if [ "$$CODE" = "200" ] || [ "$$CODE" = "301" ] || [ "$$CODE" = "302" ]; then
            echo "Frontend responding (HTTP $$CODE)"
            exit 0
          fi
          echo "Attempt $$i: HTTP $$CODE; retrying..."
          sleep 5
        done
        echo "Verification failed"
        exit 1

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}"

timeout: "1200s"
